name: governance-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the documented minimum (AGENTS.md); 3.12 catches PEP 701 drift.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install --upgrade pip sympy

      - name: Run test suite
        run: python -m unittest discover -s tests -v

      - name: SSoT consistency gate
        run: python scripts/validate_ssot_consistency.py

      - name: Record run evidence
        if: always()
        run: |
          python scripts/run_local_tests.py --output storage/logs/ci_run_${{ matrix.python-version }}.json || true
          cat storage/logs/ci_run_${{ matrix.python-version }}.json || true
