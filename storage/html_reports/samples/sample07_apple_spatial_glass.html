<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Sample 07: Apple Spatial VisionOS Glass</title>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;600;700&family=Inter:wght@400;600;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 60%, #020617 100%);
            color: #f8fafc;
            font-family: -apple-system, 'Inter', 'Noto Sans KR', sans-serif;
            padding: 2.5rem;
            min-height: 100vh;
        }
        .spatial-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(24px) saturate(200%);
            -webkit-backdrop-filter: blur(24px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            margin-bottom: 2rem;
        }
        .title { font-size: 2rem; font-weight: 700; background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.25rem; }
        .glass-pill { background: rgba(255,255,255,0.12); padding: 0.5rem 1rem; border-radius: 99px; font-size: 0.8rem; font-weight: 600; display: inline-block; }
    </style>
</head>
<body>
    <div class="spatial-card">
        <span class="glass-pill">SAMPLE 07: APPLE VISIONOS SPATIAL GLASS</span>
        <div class="title" style="margin-top:0.75rem;">202606_MATH_DIF_15</div>
        <p style="color:#94a3b8; margin-top:0.5rem;">투명한 이중 프로스테드 글래스 + 입체적인 광원 그라데이션</p>
    </div>
    <div class="grid">
        <div class="spatial-card" style="margin:0;">
            <h3>Axis 1: Curriculum</h3>
            <p style="color:#cbd5e1; margin-top:0.75rem;">[12수학II02-03] 삼차함수의 극값 및 그래프 개형</p>
        </div>
        <div class="spatial-card" style="margin:0;">
            <h3>Axis 3: Symbolic</h3>
            <p style="color:#cbd5e1; margin-top:0.75rem;">$f(x) = \frac{1}{4}x^2(x-3) \implies f(6)=27$</p>
        </div>
        <div class="spatial-card" style="margin:0;">
            <h3>Axis 5: Verification</h3>
            <span class="glass-pill" style="background:rgba(34,197,94,0.2); color:#86efac;">Choice ④ (27) PASS</span>
        </div>
    </div>
</body>
</html>
