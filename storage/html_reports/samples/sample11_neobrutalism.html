<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Sample 11: Modern Neo-Brutalism Math Pop</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Noto+Sans+KR:wght@700;900&display=swap" rel="stylesheet">
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #fef08a; color: #000; font-family: 'Space Grotesk', 'Noto Sans KR', sans-serif; padding: 2.5rem; }
        .neo-card { background: #fff; border: 4px solid #000; box-shadow: 6px 6px 0 #000; border-radius: 12px; padding: 1.75rem; margin-bottom: 1.5rem; }
        .neo-title { font-size: 2rem; font-weight: 900; background: #ec4899; color: #fff; display: inline-block; padding: 0.2rem 0.8rem; border: 3px solid #000; box-shadow: 3px 3px 0 #000; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
        .tag-neo { background: #06b6d4; font-weight: 700; border: 2px solid #000; padding: 0.2rem 0.6rem; border-radius: 4px; display: inline-block; margin-bottom: 0.5rem; }
    </style>
</head>
<body>
    <div class="neo-card">
        <span class="tag-neo">SAMPLE 11: NEO-BRUTALISM POP</span>
        <div><div class="neo-title">202606_MATH_DIF_15</div></div>
        <p style="margin-top:1rem; font-weight:700;">강렬한 네오브루탈리즘 + 블랙 보더 + 드롭 섀도우</p>
    </div>
    <div class="grid">
        <div class="neo-card" style="background:#a7f3d0;">
            <h3>📄 문항 원문</h3>
            <p style="margin-top:1rem;">상수항이 0인 삼차함수 $f(x)$에 대하여 $f(6)$의 값은?</p>
        </div>
        <div class="neo-card" style="background:#bae6fd;">
            <h3>⚡ 8-Axis 핵심 도출</h3>
            <p style="margin-top:1rem; font-weight:700;">$f(x) = \frac{1}{4}x^2(x-3)$</p>
            <div style="margin-top:1rem; background:#facc15; padding:0.5rem; border:3px solid #000; font-weight:900;">
                정답: ④번 (27)
            </div>
        </div>
    </div>
</body>
</html>
