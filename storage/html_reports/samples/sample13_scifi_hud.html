<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Sample 13: Sci-Fi HUD Command Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #020b14; color: #00f0ff; font-family: 'Fira Code', monospace; padding: 2rem; }
        .hud-frame { border: 2px solid #00f0ff; background: rgba(0, 240, 255, 0.03); padding: 1.5rem; position: relative; margin-bottom: 1.5rem; clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px)); }
        .hud-title { font-size: 1.8rem; font-weight: 700; color: #ff0055; text-shadow: 0 0 10px rgba(255, 0, 85, 0.8); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
        .hud-tag { background: rgba(0, 240, 255, 0.15); color: #00f0ff; border: 1px solid #00f0ff; padding: 0.2rem 0.6rem; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="hud-frame">
        <span class="hud-tag">SAMPLE 13: SCI-FI HUD COMMAND CENTER</span>
        <div class="hud-title" style="margin-top:0.5rem;">[ITEM_TARGET: 202606_MATH_DIF_15]</div>
        <p style="color:#7dd3fc; margin-top:0.5rem;">SF 미래형 HUD 인터페이스 + 홀로그램 헥사곤 프레임</p>
    </div>
    <div class="grid">
        <div class="hud-frame">
            <h3 style="color:#ff0055;">[TELEMETRY_AXIS_DATA]</h3>
            <div style="margin-top:1rem; color:#fff;">
                &gt; AXIS_1: [12수학II02-03] (극값과 미분가능성)<br>
                &gt; AXIS_3: f(x) = 1/4 * x^2 * (x-3)<br>
                &gt; AXIS_5: VERIFIED_PASS (Choice ④ = 27)
            </div>
        </div>
        <div class="hud-frame">
            <h3 style="color:#00f0ff;">[SYSTEM_ASSERTION]</h3>
            <div style="font-size:1.5rem; font-weight:700; color:#00ff66; margin-top:1rem;">
                SOLVABILITY: PASS (100%)
            </div>
        </div>
    </div>
</body>
</html>
