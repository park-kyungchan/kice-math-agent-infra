<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Sample 15: Interactive Figma Canvas Workbench</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #1e1e1e;
            background-image: radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 20px 20px;
            color: #ffffff;
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
            padding: 2.5rem;
            min-height: 100vh;
        }
        .canvas-toolbar { background: #2c2c2c; border: 1px solid #444; border-radius: 12px; padding: 0.75rem 1.5rem; display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .canvas-node { background: #2c2c2c; border: 2px solid #0c8ce9; border-radius: 12px; padding: 1.5rem; width: 340px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); position: absolute; }
        .canvas-wrapper { position: relative; height: 500px; }
    </style>
</head>
<body>
    <div class="canvas-toolbar">
        <div style="font-weight:700; color:#0c8ce9;">SAMPLE 15: INTERACTIVE FIGMA CANVAS WORKBENCH</div>
        <div style="font-size:0.85rem; color:#aaa;">202606_MATH_DIF_15 NODE CANVAS</div>
    </div>
    <div class="canvas-wrapper">
        <!-- Node 1 -->
        <div class="canvas-node" style="top: 20px; left: 20px;">
            <div style="font-size:0.8rem; font-weight:700; color:#0c8ce9; margin-bottom:0.5rem;">[NODE 1: QUESTION INPUT]</div>
            <p style="font-size:0.9rem;">상수항이 0인 삼차함수 $f(x)$에 대하여 조건 (가), (나) 만족 시 $f(6)$은?</p>
        </div>

        <!-- Node 2 -->
        <div class="canvas-node" style="top: 20px; left: 400px; border-color:#10b981;">
            <div style="font-size:0.8rem; font-weight:700; color:#10b981; margin-bottom:0.5rem;">[NODE 2: 8-AXIS SYMBOLIC MODEL]</div>
            <p style="font-size:0.9rem;">$f(x) = \frac{1}{4}x^2(x-3) \implies f(6)=27$</p>
            <div style="margin-top:1rem; background:#10b981; color:#000; padding:0.4rem; border-radius:4px; font-weight:700; text-align:center;">
                Choice ④ (27) VERIFIED
            </div>
        </div>
    </div>
</body>
</html>
